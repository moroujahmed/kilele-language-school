<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Kilele Language School in Lisbon. Learn English, French and Portuguese online.">
  <title>Kilele Language School</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color: #172033; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; }
    header { background: #123b63; color: #fff; padding: 3.5rem 1.25rem; text-align: center; }
    header h1 { margin: 0 0 .7rem; font-size: clamp(2rem, 5vw, 3rem); }
    header p { margin: 0; font-size: 1.1rem; }
    main { max-width: 780px; margin: 2.5rem auto; padding: 0 1.25rem; }
    .notice { background: #e5f4ec; border-left: 5px solid #218653; padding: 1rem 1.2rem; border-radius: 8px; line-height: 1.5; }
    .button { display: inline-block; margin-top: 1rem; padding: .85rem 1.2rem; border-radius: 7px; background: #123b63; color: #fff; text-decoration: none; font-weight: 700; }
    .button:focus, a:focus { outline: 3px solid #e0a52b; outline-offset: 3px; }
    footer { text-align: center; color: #596579; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Kilele Language School</h1>
    <p>Learn English, French and Portuguese online.</p>
  </header>
  <main>
    <section class="notice" aria-label="Website update">
      <strong>Website update:</strong> Registration of interest is now open for new language learners.
    </section>
    <p>Explore language learning opportunities with Kilele Language School in Lisbon.</p>
    <a class="button" href="contact.html">Register interest</a>

  <footer>&copy; 2026 Kilele Language School</footer>
